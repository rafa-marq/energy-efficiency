[project]
name = "truewatt-data"
version = "0.1.0"
description = "Open, source-traceable database of appliance energy use and electricity prices, by country."
requires-python = ">=3.10"
dependencies = []  # fetchers are stdlib-only so contributors can run them anywhere

[dependency-groups]
dev = [
    "jsonschema>=4.21",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
